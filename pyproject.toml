[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laa"
version = "1.11.0"
description = "语言无障碍 Agent 纯文本翻译客户端 (Language-Accessible Agent)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["laa_core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]